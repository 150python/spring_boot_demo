server:
  port: 8081
  tomcat:
    max-connections: 20
    threads:
      max: 20
      min-spare: 10
    accept-count: 10

spring:
  #数据库配置
  datasource:
    username: root
    password: 183100
    url: jdbc:mysql://127.0.0.1:3306/springboot?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialSize: 5
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    filters: stat
    # Redis配置
  data:
    redis:
      host: 127.0.30.1
      port: 6379
      database: 0
      timeout: 3000ms

#mybatis
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml

#日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml


